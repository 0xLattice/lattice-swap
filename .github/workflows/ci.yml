name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Rust-signed joint-key spends checked by Lattice's own consensus signature
  # rules on Linux, where swift-crypto verifies Ed25519 through BoringSSL.
  lattice-interop:
    runs-on: ubuntu-24.04
    container: swift:6.1-jammy
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq curl gcc
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: ./interop/run.sh 25
