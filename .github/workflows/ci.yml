name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The machines without the native I/O, built for the browser, and every
  # machine test run again in wasm under node. `secp256k1-sys` needs a clang
  # with the WebAssembly target.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm
      - run: rustup target add wasm32-unknown-unknown && rustup component add clippy
      # The version Cargo.lock pins for `wasm-bindgen`.
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo clippy -p swap -p swap-nexus-tx -p swap-wasm --no-default-features --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo build --release -p swap-wasm --target wasm32-unknown-unknown
      # Unoptimized, the proofs take minutes in wasm.
      - run: cargo test -p swap -p swap-wasm --no-default-features --target wasm32-unknown-unknown --lib
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 3

  # Rust-signed joint-key spends checked by Lattice's own consensus signature
  # rules on Linux, where swift-crypto verifies Ed25519 through BoringSSL.
  lattice-interop:
    runs-on: ubuntu-24.04
    container: swift:6.1-jammy
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq curl gcc
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: ./interop/run.sh 25

  # Transfers and joint-key claims built here, submitted to and mined by a real
  # Lattice node, then whole swaps against that node and a regtest bitcoind.
  # Host networking: the node's RPC listens on loopback only.
  nexus-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # lattice-node 3.2.0
      NEXUS_NODE_IMAGE: ghcr.io/0xlattice/lattice-node@sha256:b9951cdce3469add47d1c086a46185edc0f3da4d715309b94ed553e008de1d26
    steps:
      - uses: actions/checkout@v4
      - run: docker pull "$NEXUS_NODE_IMAGE"
      - run: cargo test -p swap-nexus-tx --test node -- --ignored --nocapture
      - run: cargo test -p swap --test e2e -- --ignored --nocapture --test-threads=1
      - run: cargo test -p lattice-swap --test e2e -- --ignored --nocapture --test-threads=1
