[package]
name = "swap-bitcoin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bitcoin side of NEX<->BTC atomic swaps: Taproot lock, cancel, refund and punish with adaptor signatures"

[dependencies]
bitcoin = "0.32"
schnorr_fun = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[dev-dependencies]
corepc-node = { version = "0.12", features = ["30_2", "download"] }
