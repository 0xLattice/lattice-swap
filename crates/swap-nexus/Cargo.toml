[package]
name = "swap-nexus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nexus side of NEX<->BTC atomic swaps: joint-key Ed25519 signing"

[dependencies]
curve25519-dalek = { version = "4", features = ["digest", "rand_core"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
