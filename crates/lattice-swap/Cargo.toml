[package]
name = "lattice-swap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A command line tool that runs one side of a NEX<->BTC atomic swap"

[dependencies]
swap = { path = "../swap" }
swap-bitcoin = { path = "../swap-bitcoin" }
swap-nexus-tx = { path = "../swap-nexus-tx" }
bitcoin = "0.32"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = { version = "0.4", features = ["serde"] }
ivy = { git = "https://github.com/0xLattice/ivy-rs", rev = "e020256" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The watchtower's endpoint on a relay, which may be https.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
base64 = "0.22"
data-encoding = "2"
corepc-node = { version = "0.12", features = ["30_2", "download"] }
swap-relay = { path = "../swap-relay" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
