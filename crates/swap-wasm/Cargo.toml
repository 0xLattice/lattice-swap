[package]
name = "swap-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The NEX<->BTC swap machines for a browser, with JSON in and out"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
swap = { path = "../swap", default-features = false }
swap-nexus-tx = { path = "../swap-nexus-tx", default-features = false }
bitcoin = "0.32"
ed25519-dalek = "2"
hex = "0.4"
ivy-core = { git = "https://github.com/0xLattice/ivy-rs", rev = "e020256" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
