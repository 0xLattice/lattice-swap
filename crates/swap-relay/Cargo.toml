[package]
name = "swap-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A relay for lattice-swap: an offer board and a pipe between the parties"

[dependencies]
# HTTP and WebSockets on tokio, from the tokio project; its WebSocket is
# tokio-tungstenite, which the CLI's client already uses.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
ivy = { git = "https://github.com/0xLattice/ivy-rs", rev = "e020256" }
swap = { path = "../swap" }
ureq = { version = "2", default-features = false, features = ["json"] }
