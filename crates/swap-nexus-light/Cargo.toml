[package]
name = "swap-nexus-light"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nexus light client for NEX<->BTC swaps: a NEX lock checked against Nexus proof of work, sans-IO"

[dependencies]
data-encoding = "2"
sha2 = "0.10"

[dev-dependencies]
ciborium = "0.2"

# The 32-bit unit tests (archive lengths, the schedule's arithmetic) run in
# wasm too.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
